appId: com.centras.corporatechat
productName: Centras Chat
copyright: Copyright © 2026 Centras
directories:
  output: dist-installer
  buildResources: resources
files:
  - dist-electron/**/*
  - .next/**/*
  - "!**/.next/cache/**"
  - public/**/*
  - package.json
win:
  icon: resources/icon.ico
  artifactName: Centras-Chat-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: Centras-Chat-Portable-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Centras Chat
  uninstallDisplayName: Centras Chat
  installerLanguages:
    - ru_RU
    - en_US
  displayLanguageSelector: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerHeader: resources/installerHeader.bmp
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
asar: true
