# Centras Chat server side: the gateway in front of Supabase plus TLS termination.
# 1) cp .env.server.example .env.server && fill it in
# 2) docker compose up -d
# Clients (web and desktop) are pointed at https://<GATEWAY_DOMAIN> — nothing else.
services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: centras-chat-gateway:latest
    restart: unless-stopped
    env_file: .env.server
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-chat.example.com}
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
